[project]
name = "oekaki-vla"
version = "0.1.0"
description = "Tactile-aware drawing VLA: SO-101 + spring pen in MuJoCo, SmolVLA fine-tuning"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot[smolvla,dataset]==0.6.1",
    "mujoco>=3.3",
    "opencv-python-headless",
    "numpy",
    "pyyaml",
    "matplotlib",
    "imageio[ffmpeg]",
    "pytest",
    "tabulate>=0.10.0",
    "scikit-image>=0.26.0",
]

[tool.setuptools.packages.find]
include = ["oekaki*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true
