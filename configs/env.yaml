# Simulation environment configuration (all lengths in metres, angles in radians unless noted)
robot_xml: assets/so101/so101.xml

sim:
  fps: 30                 # control / recording frequency
  substeps: 16            # physics steps per control step -> timestep = 1/(fps*substeps)
  interpolate_ctrl: true  # ramp servo targets linearly over the substeps of a control step

pen:
  holder_offset: [-0.026, 0.0, -0.030]   # holder body position in the gripper frame (outside the fixed jaw)
  mount_pitch_deg: 42.0                 # holder tilt about the gripper y axis so the pen can stand vertical
  holder_length: 0.060
  holder_radius: 0.0065
  pen_length: 0.110                     # pen body length (from top to tip)
  pen_radius: 0.0040
  tip_radius: 0.0010
  tip_offset: -0.095                    # tip z in the holder frame at zero compression (gripper -z = drawing direction)
  mass: 0.008
  travel: 0.010           # slide range 0..10 mm (positive = compressed)
  stiffness: 300.0        # N/m
  springref: 0.0          # spring rest length at the joint limit (no preload)
  damping: 3.0            # N s/m
  armature: 0.002         # kg, reflected inertia of the pen slide
  tip_friction: 0.15
  contact_solref: [0.010, 1.0]   # pen-tip/paper contact softness (no chatter at this value)
  contact_threshold: 0.0005   # contact switch fires above 0.5 mm compression

canvas:
  size: 0.15              # 15 cm square paper
  thickness: 0.002
  center: [0.215, 0.0]    # nominal x,y in robot base frame
  height: 0.020           # nominal paper top-surface height above robot base
  tex_size: 512           # canvas_img resolution (pixels)
  line_width_px: 8        # ~2.3 mm marker line
  line_color: [20, 20, 120]

cameras:
  width: 256
  height: 256
  top:
    pos: [0.30, -0.30, 0.42]
    lookat: [0.215, 0.0, 0.02]
    fovy: 42
  wrist:
    name: wrist_pen       # camera on the pen holder (holder frame: z = pen axis up)
    pos: [0.045, -0.050, -0.045]
    lookat: [0.0, 0.0, -0.100]
    up: [0, 0, 1]
    fovy: 70

randomization:
  height_range: 0.020     # +/- paper height
  xy_range: 0.010         # +/- paper horizontal shift
  tilt_range_deg: 0.0     # optional tilt (disabled for MVP)
  light_jitter: 0.15
  paper_tint: 0.04
  disturbance:            # mid-episode paper height change
    prob: 0.25
    delta_min: 0.005
    delta_max: 0.010
    rate: 0.020           # m/s ramp speed of the paper while it moves

visual_floor_z: -0.060   # floor plane height (was -0.0024: hid the paper below -22.4 mm); robot on a pedestal

home_tip: [0.14, 0.0, 0.10]     # pen-tip (rest) position of the home pose; joint angles solved by IK
gripper_cmd: 0.0
wrist_roll_cmd: 0.0
